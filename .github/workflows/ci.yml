name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust
        run: cargo check --locked

      - name: Test Rust
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  linux-distro-smoke:
    name: Linux release smoke test (Arch + Fedora)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Build Linux release once
        run: cargo build --release --locked

      - name: Run binary in Arch and Fedora
        run: |
          for image in archlinux:latest fedora:latest; do
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/work:ro" \
              --workdir /work \
              "$image" \
              /work/target/release/tickt --version
          done
