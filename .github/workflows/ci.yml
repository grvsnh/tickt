name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust
        run: cargo check --locked

      - name: Test Rust
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  platform-smoke:
    name: Build and CLI smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/debug/tickt
          - os: macos-13
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/debug/tickt
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/debug/tickt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/debug/tickt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Build target
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Run noninteractive smoke command
        shell: bash
        run: ${{ matrix.binary }} --version
