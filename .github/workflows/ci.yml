name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust
        run: cargo check --locked

      - name: Test Rust
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  linux-distro-smoke:
    name: Linux release smoke test (Arch + Fedora)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install static Linux linker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build portable Linux release once
        run: ./scripts/package-linux.sh

      - name: Verify checksum and extract archive
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum -c tickt-linux-x86_64.tar.gz.sha256)
          mkdir extracted
          tar -xzf dist/release/tickt-linux-x86_64.tar.gz -C extracted

      - name: Run binary in representative Linux distributions
        run: |
          set -euo pipefail
          for image in \
            ubuntu:22.04 \
            ubuntu:24.04 \
            debian:bullseye-slim \
            debian:bookworm-slim \
            archlinux:latest \
            fedora:latest \
            opensuse/leap:15.6 \
            rockylinux:9 \
            alpine:3.20; do
            docker run --rm \
              --volume "$GITHUB_WORKSPACE/extracted:/release:ro" \
              "$image" \
              /release/tickt --version
          done
