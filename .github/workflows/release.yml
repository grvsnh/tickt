name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: resolve
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          release_tag="v$version"
          release_notes="release-notes/v$version.txt"
          test -f "$release_notes"
          current_commit="$(git rev-parse HEAD)"

          if git rev-parse --verify --quiet "refs/tags/$release_tag"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/$release_tag")"
            if [[ "$tagged_commit" != "$current_commit" ]]; then
              echo "$release_tag already exists; release is unchanged, so this run is a no-op"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_notes=$release_notes" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Install Rust and musl target
        if: steps.resolve.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install static Linux linker
        if: steps.resolve.outputs.should_release == 'true'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      - name: Check release metadata
        if: steps.resolve.outputs.should_release == 'true'
        run: ./scripts/check-release-metadata.sh

      - name: Run release quality gate
        if: steps.resolve.outputs.should_release == 'true'
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and package static Linux binary
        if: steps.resolve.outputs.should_release == 'true'
        run: ./scripts/package-linux.sh "${RELEASE_TAG#v}"

      - name: Verify checksum and extracted binary
        if: steps.resolve.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum -c tickt-linux-x86_64.tar.gz.sha256)
          mkdir extracted
          tar -xzf dist/release/tickt-linux-x86_64.tar.gz -C extracted
          extracted/tickt --version

      - name: Smoke-test Linux distributions
        if: steps.resolve.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          for image in \
            ubuntu:22.04 \
            ubuntu:24.04 \
            debian:bullseye-slim \
            debian:bookworm-slim \
            archlinux:latest \
            fedora:latest \
            opensuse/leap:15.6 \
            rockylinux:9 \
            alpine:3.20; do
            echo "Testing $image"
            docker run --rm \
              --volume "$GITHUB_WORKSPACE/extracted:/release:ro" \
              "$image" \
              /release/tickt --version
          done

      - name: Create and push release tag
        if: steps.resolve.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        if: steps.resolve.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.release_tag }}
          name: Tickt ${{ steps.resolve.outputs.release_tag }}
          body_path: ${{ steps.resolve.outputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            dist/release/tickt-linux-x86_64.tar.gz
            dist/release/tickt-linux-x86_64.tar.gz.sha256
