name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and push release tag
        id: resolve
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          release_tag="v$version"
          current_commit="$(git rev-parse HEAD)"

          if git rev-parse --verify --quiet "refs/tags/$release_tag"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/$release_tag")"
            if [[ "$tagged_commit" != "$current_commit" ]]; then
              echo "$release_tag already points to another commit; bump Cargo.toml before pushing main" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$release_tag" -m "Release $release_tag"
            git push origin "$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install static Linux linker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build and package static Linux binary
        run: ./scripts/package-linux.sh "${RELEASE_TAG#v}"

      - name: Verify checksum and extracted binary
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum -c tickt-linux-x86_64.tar.gz.sha256)
          mkdir extracted
          tar -xzf dist/release/tickt-linux-x86_64.tar.gz -C extracted
          extracted/tickt --version

      - name: Smoke-test Linux distributions
        run: |
          set -euo pipefail
          for image in \
            ubuntu:22.04 \
            ubuntu:24.04 \
            debian:bullseye-slim \
            debian:bookworm-slim \
            archlinux:latest \
            fedora:latest \
            opensuse/leap:15.6 \
            rockylinux:9 \
            alpine:3.20; do
            echo "Testing $image"
            docker run --rm \
              --volume "$GITHUB_WORKSPACE/extracted:/release:ro" \
              "$image" \
              /release/tickt --version
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.release_tag }}
          name: Tickt ${{ steps.resolve.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/release/tickt-linux-x86_64.tar.gz
            dist/release/tickt-linux-x86_64.tar.gz.sha256
