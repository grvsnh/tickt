name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, without the v prefix"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and create tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          tag="v$version"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a semantic version such as 1.0.0" >&2
            exit 1
          fi
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$version" = "$cargo_version"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "tag $tag already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux x86_64 release
    if: always() && (github.event_name == 'push' || needs.prepare.result == 'success')
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Confirm Cargo version matches tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$version" = "$cargo_version"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package archive and checksum
        run: |
          mkdir -p dist/package
          cp target/release/tickt dist/package/tickt
          chmod 0755 dist/package/tickt
          tar -C dist/package -czf dist/tickt-linux-x86_64.tar.gz tickt
          (cd dist && sha256sum tickt-linux-x86_64.tar.gz > tickt-linux-x86_64.tar.gz.sha256)

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tickt-linux-x86_64
          path: |
            dist/tickt-linux-x86_64.tar.gz
            dist/tickt-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  linux-distro-smoke:
    name: Verify release on Arch and Fedora
    if: always() && (github.event_name == 'push' || needs.prepare.result == 'success')
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: tickt-linux-x86_64
          path: dist

      - name: Verify checksum and extract archive
        run: |
          (cd dist && sha256sum -c tickt-linux-x86_64.tar.gz.sha256)
          mkdir extracted
          tar -xzf dist/tickt-linux-x86_64.tar.gz -C extracted

      - name: Run extracted binary in Arch and Fedora
        run: |
          for image in archlinux:latest fedora:latest; do
            docker run --rm \
              --volume "$GITHUB_WORKSPACE/extracted:/release:ro" \
              "$image" \
              /release/tickt --version
          done

  publish:
    name: Publish GitHub release
    if: always() && (github.event_name == 'push' || needs.prepare.result == 'success')
    needs: [prepare, build, linux-distro-smoke]
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: tickt-linux-x86_64
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}
          name: Tickt ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*
