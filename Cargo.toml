[package]
name = "tickt"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven terminal focus dashboard"
license = "MIT"
readme = "README.md"
repository = "https://github.com/grvsnh/tickt"
keywords = ["pomodoro", "terminal", "productivity", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
